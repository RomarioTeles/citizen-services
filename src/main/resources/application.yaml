spring:
  application:
    name: ${APP_NAME:citizen-services}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citizenservices}
    username: ${DB_USERNAME:citizen}
    password: ${DB_PASSWORD:citizen}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
          show-details: never
        readiness:
          include: db, ping
          show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.0.1-SNAPSHOT

logging:
  structured:
    format:
      console: ecs
  include-application-name: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

security:
  username: ${SECURITY_USERNAME:dev}
  password: ${SECURITY_PASSWORD:dev-password}
