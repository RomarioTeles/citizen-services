spring:
  application:
    name: ${APP_NAME:citizen-services}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citizenservices}
    username: ${DB_USERNAME:citizen}
    password: ${DB_PASSWORD:citizen}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    version: 0.0.1-SNAPSHOT

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
