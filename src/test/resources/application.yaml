spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/citizenservices
    username: citizen
    password: citizen
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
          show-details: always
        readiness:
          include: db, ping
          show-details: always

security:
  username: dev
  password: dev-password
  admin:
    username: admin
    password: admin-password
