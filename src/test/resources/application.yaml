# Datasource connection details (JDBC URL, username, password) are provided
# automatically by Testcontainers via @ServiceConnection in the integration tests.
# Do not hardcode a datasource here, otherwise it would point tests at a local
# PostgreSQL instead of the ephemeral container.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
          show-details: always
        readiness:
          include: db, ping
          show-details: always

security:
  username: dev
  password: dev-password
  admin:
    username: admin
    password: admin-password
