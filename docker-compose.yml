services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

  # PostgreSQL será ativado nos próximos incrementos, quando JPA for configurado.
  # Para subir: docker compose --profile infra up
  postgres:
    image: postgres:16-alpine
    profiles:
      - infra
    environment:
      POSTGRES_DB: citizenservices
      POSTGRES_USER: citizen
      POSTGRES_PASSWORD: citizen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
