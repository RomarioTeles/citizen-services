services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:postgresql://postgres:5432/citizenservices
      DB_USERNAME: ${POSTGRES_USER:-citizen}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-citizen}
      # OpenTelemetry (tracing via Java Agent -> OTLP -> Collector -> Jaeger).
      # O endpoint usa o nome do serviço Docker "otel-collector" (NUNCA
      # localhost), pois a app roda em container na mesma rede do compose.
      # A aplicação NÃO envia mais traces diretamente para o Jaeger: agora
      # eles passam pelo OpenTelemetry Collector.
      OTEL_SERVICE_NAME: citizen-services
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      # Nesta primeira etapa focamos apenas em traces.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "citizen-services"
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    profiles:
      - infra
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citizenservices}
      POSTGRES_USER: ${POSTGRES_USER:-citizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citizen}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citizen} -d ${POSTGRES_DB:-citizenservices}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles:
      - infra
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.0.2
    profiles:
      - infra
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    profiles:
      - infra
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    expose:
      # Porta OTLP HTTP usada internamente pela app (não precisa publicar no host).
      - "4318"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles:
      - infra
    environment:
      # Habilita o receiver OTLP (gRPC 4317 e HTTP 4318) no collector.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (compatibilidade / uso opcional)
      - "4317:4317"     # OTLP gRPC (usado pelo otel-collector como destino)

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    profiles:
      - infra
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-dev}
      xpack.security.enabled: "true"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-elastic-dev} http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    profiles:
      - infra
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-kibana-dev}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.4
    profiles:
      - infra
    environment:
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elastic-dev}
      XPACK_MONITORING_ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      XPACK_MONITORING_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elastic-dev}
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.monitoring.enabled: "false"
    ports:
      - "12201:12201/udp"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 | grep -q 'green'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  elasticsearch_data:
