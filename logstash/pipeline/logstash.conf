input {
  gelf {
    port => 12201
    type => "docker"
  }
}

filter {
  # O campo "message" do GELF contém o JSON ECS produzido pelo Spring Boot.
  #
  # Sem "target", o json filter promove TODOS os campos parseados DIRETO para
  # a raiz do evento (trace_id, span_id, trace_flags, correlationId, method,
  # path, status, etc.), de forma automática e sem precisar listar campo a
  # campo. O "message" cru do GELF é substituído pelo "message" interno do
  # ECS (ex.: "HTTP request completed").
  #
  # Usamos o json filter nativo (em vez de iteração manual via ruby) porque
  # ele trata corretamente campos especiais como @timestamp — que exige o
  # tipo LogStash::Timestamp e falha se setado como String.
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  # Drop internal Docker/GELF metadata not useful for log analysis
  mutate {
    remove_field => ["host", "_id", "_version", "facility", "facility_num", "severity", "level"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index    => "citizen-services-logs-%{+YYYY.MM.dd}"
  }
}
