input {
  gelf {
    port => 12201
    type => "docker"
  }
}

filter {
  # The GELF message field contains the ECS JSON produced by Spring Boot
  json {
    source => "message"
    target => "ecs"
    skip_on_invalid_json => true
  }

  # Promote ECS fields to the root document
  if [ecs] {
    mutate {
      rename => {
        "[ecs][@timestamp]"    => "@timestamp"
        "[ecs][log.level]"     => "log.level"
        "[ecs][service.name]"  => "service.name"
        "[ecs][message]"       => "message"
        "[ecs][correlationId]" => "correlationId"
        "[ecs][method]"        => "method"
        "[ecs][path]"          => "path"
        "[ecs][status]"        => "status"
        "[ecs][durationMs]"    => "durationMs"
        "[ecs][error.type]"    => "error.type"
        "[ecs][error.message]" => "error.message"
      }
      remove_field => ["ecs"]
    }
  }

  # Drop internal Docker/GELF metadata not useful for log analysis
  mutate {
    remove_field => ["host", "_id", "_version", "facility", "facility_num", "severity", "level"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    index    => "citizen-services-logs-%{+YYYY.MM.dd}"
  }
}
